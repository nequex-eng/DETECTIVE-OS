name: Deploy DETECTIVE OS to Cloudflare Pages

on:
  workflow_run:
    workflows: ["DETECTIVE OS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY to publish the current main build to production
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_production == 'DEPLOY') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "3c76b79d615b6bc886fe564307682767"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require deployment token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is required"
            exit 1
          fi
      - name: Build and deploy
        run: python3 deploy.py
