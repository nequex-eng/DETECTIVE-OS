name: DETECTIVE OS CI

on:
  push:
    branches: [main, t2-isdal-woman-casepack]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check investigation workspace JavaScript and panes
        run: python3 scripts/check_frontend.py
      - name: Compile Python entry points
        run: python3 -m py_compile deploy.py scripts/build_site.py scripts/job.py scripts/run_job.py
      - name: Validate Isdal Woman case pack
        run: python3 -m detective_os.cli check cases/case-no-1970-001
      - name: Run Isdal Woman engine and generate report
        run: python3 -m detective_os.cli run cases/case-no-1970-001 --out reports --db :memory:
      - name: Build static case center and case pages
        run: python3 scripts/build_site.py
      - name: Upload T2 generated report and page
        uses: actions/upload-artifact@v4
        with:
          name: t2-isdal-woman-report
          path: |
            reports/CASE-NO-1970-001-report.md
            reports/CASE-NO-1970-001-report.json
            public/case-no-1970-001.html
      - name: Run unit and acceptance tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate first case pack
        run: python3 -m detective_os.cli check cases/case-cn-1996-001
      - name: Validate Baiyin case pack
        run: python3 scripts/validate_baiyin.py
      - name: Validate Baiyin engine pack
        run: python3 -m detective_os.cli check cases/case-cn-1988-001
