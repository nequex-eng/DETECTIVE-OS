name: DETECTIVE OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check investigation workspace JavaScript and panes
        run: python3 scripts/check_frontend.py
      - name: Run unit and acceptance tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate first case pack
        run: python3 -m detective_os.cli check cases/case-cn-1996-001
      - name: Validate Baiyin case pack
        run: python3 scripts/validate_baiyin.py
      - name: Validate Baiyin engine pack
        run: python3 -m detective_os.cli check cases/case-cn-1988-001
