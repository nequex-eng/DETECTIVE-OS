<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>DETECTIVE OS — 自动调查</title>
<style>body{background:#0d1117;color:#d7dee8;font-family:system-ui,sans-serif;
max-width:900px;margin:0 auto;padding:24px}h1{font-size:22px}h2{font-size:17px;
color:#e8b64c}a{color:#7fb3ff}input,select,textarea{width:100%;box-sizing:border-box;
background:#161d27;color:#d7dee8;border:1px solid #333;padding:10px;margin:6px 0;
font-size:15px}button{background:#e8b64c;color:#111;border:0;padding:10px 22px;
font-size:15px;cursor:pointer;margin-top:8px}button:disabled{opacity:.5}
.note{color:#9aa7b5;font-size:13px}table{border-collapse:collapse;width:100%}
td,th{border:1px solid #333;padding:6px 10px;text-align:left}
.stage{color:#e8b64c}.draft{color:#ff7b72;font-weight:bold}
pre{white-space:pre-wrap;word-break:break-word;background:#161d27;padding:14px;
border:1px solid #333;font-size:14px;line-height:1.6}
li{margin:4px 0}.ops-shell{max-width:1120px;margin:0 auto;padding:26px 28px 60px}body{max-width:none;padding:0;background:radial-gradient(ellipse at 85% 0%,#1c2d3a 0,transparent 42%),#08121d;color:#dce5ed}body>p:first-of-type{max-width:1120px;margin:20px auto 0;padding:0 28px}h1{font:500 clamp(28px,4vw,42px)/1.15 Georgia,serif;letter-spacing:.2px;margin:16px 0 10px}h2{font:500 19px Georgia,serif;color:#e0c17e;border-bottom:1px solid #2b4052;padding-bottom:10px;margin:30px 0 15px}.note{color:#92a6b8;line-height:1.8}.draft{color:#e3bd75}form,#job{background:linear-gradient(145deg,#122333,#0d1925);border:1px solid #30475b;border-radius:3px;padding:22px;margin:15px 0 25px}label{display:block;color:#a9bac8;font-size:11px;letter-spacing:.5px;margin:13px 0 5px}input,select,textarea{background:#091521;border:1px solid #344b60;border-radius:2px;color:#e0e8ef;padding:11px 12px;margin:0;outline:none}input:focus,select:focus,textarea:focus{border-color:#b18d51}button{background:#c5a05e;color:#111a22;border:1px solid #dfbd7c;border-radius:2px;padding:11px 20px;font-size:11px;font-weight:800;letter-spacing:.8px}button:disabled{opacity:.5}#job{border-left:3px solid #c5a05e}#jobId{font:10px ui-monospace,monospace;color:#9bb4c9}#jobStatus{color:#e2c17b;font-size:11px}#events{padding-left:18px;color:#94a9bb;font-size:11px;line-height:1.8}#result{border-top:1px solid #2c4051;margin-top:15px;padding-top:15px;color:#d2dde7;font-size:12px;line-height:1.8}#result table{margin:12px 0}#result th{color:#e2c17b;background:#172838}#history{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}#history li{margin:0;background:#111f2d;border:1px solid #2c4255;padding:13px 15px;color:#9bafc0;font-size:11px;line-height:1.7}#history a{color:#e0c17e;font-weight:700}a{color:#a8c9e7}a:hover{color:#e2c17b}.stage{color:#e2c17b}@media(max-width:700px){.ops-shell{padding:18px 14px 40px}body>p:first-of-type{padding:0 14px}form,#job{padding:16px}#history{grid-template-columns:1fr}}</style></head><body>
<p><a href="index.html">← 案件中心</a></p>
<h1>DETECTIVE OS — 自动调查</h1>
<p class="note">输入一个调查方向，引擎自动跑：收集公开报道 → 去重 → 抽取事实 → 推理 → 出草稿报告。
出的是<span class="draft">未审草稿</span>：证据最高C级，假设似然为初拟，结论只作参考，不得据此指认任何人。</p>

<h2>开始新的调查</h2>
<form id="form">
<label>调查方向（必填，例如：1996年南大碎尸案）</label>
<input id="direction" maxlength="500" required placeholder="案件名或一句话调查方向">
<label>主要语言</label>
<select id="language"><option value="zh">中文</option><option value="en">English</option>
<option value="ja">日本語</option><option value="es">Español</option>
<option value="fr">Français</option><option value="de">Deutsch</option></select>
<label>地区（可选，例如：中国南京 / 美国加州）</label>
<input id="region" maxlength="200">
<label>补充提示（可选：已知关键信息、时间范围、不要查的方向）</label>
<textarea id="hints" rows="3" maxlength="500"></textarea>
<button type="submit" id="submitBtn">开始调查</button>
</form>
<p id="formMsg" class="note"></p>

<div id="job" style="display:none">
<h2>任务进度</h2>
<p>任务编号：<span id="jobId"></span> ｜ 状态：<span id="jobStatus" class="stage"></span></p>
<p id="jobNote" class="note"></p>
<ul id="events"></ul>
<div id="result"></div>
</div>

<h2>最近的任务</h2>
<ul id="history" class="history-grid"><li class="note">加载中……</li></ul>

<script>
const $ = id => document.getElementById(id);
let pollTimer = null;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function mdToHtml(md){
  const lines = String(md).split("\n"); let html = "", inList = false;
  for(const line of lines){
    if(/^#{1,3} /.test(line)){
      if(inList){html+="</ul>";inList=false;}
      const lvl = line.match(/^#+/)[0].length;
      html += `<h${lvl+1}>${esc(line.replace(/^#+\s*/,""))}</h${lvl+1}>`;
    } else if(/^- /.test(line)){
      if(!inList){html+="<ul>";inList=true;}
      html += `<li>${esc(line.replace(/^- /,""))}</li>`;
    } else if(line.trim()===""){
      if(inList){html+="</ul>";inList=false;}
    } else {
      if(inList){html+="</ul>";inList=false;}
      html += `<p>${esc(line)}</p>`;
    }
  }
  if(inList) html+="</ul>";
  return html;
}
function showJob(j){
  $("job").style.display="block";
  $("jobId").textContent=j.job_id;
  $("jobStatus").textContent=j.status+" / "+j.stage;
  $("jobNote").textContent=j.stage_note||"";
  $("events").innerHTML=(j.events||[]).map(e=>`<li>${esc(e.t||"")} — ${esc(e.message||"")}</li>`).join("");
  const r=$("result");
  if(j.status==="done"&&j.result){
    const res=j.result;
    let h=`<h2>草稿报告</h2><p class="draft">未审草稿：证据最高C级，假设似然为初拟，结论只作参考。</p>`;
    if(res.verdict) h+=`<p>结论：${esc(res.verdict)}</p>`;
    if(res.posteriors) h+=`<table><tr><th>假设</th><th>后验</th><th>先验</th></tr>`+
      res.posteriors.map(p=>`<tr><td>${esc(p.hypothesis_id)}</td><td>${esc(p.posterior)}</td><td>${esc(p.prior)}</td></tr>`).join("")+"</table>";
    if(res.coverage) h+=`<p>资料覆盖：${esc(res.coverage.score_pct)}%（${esc(res.coverage.covered)}项已覆盖/${esc(res.coverage.single)}项单来源/${esc(res.coverage.missing)}项缺失，共${esc(res.coverage.total)}项）</p>`;
    if(res.review_blockers!=null) h+=`<p>独立审查：${esc(res.review_blockers)}个blocker</p>`;
    if(res.report_md) h+=mdToHtml(res.report_md);
    r.innerHTML=h;
  } else if(j.status==="failed"){
    r.innerHTML=`<p class="draft">任务失败：${esc(j.error||"未知原因")}</p>`;
  } else r.innerHTML="";
}
async function loadJob(id){
  try{
    const res=await fetch("/api/jobs?id="+encodeURIComponent(id));
    if(res.status===404){$("jobNote").textContent="任务已不存在。";return false;}
    const j=await res.json(); showJob(j);
    return j.status==="done"||j.status==="failed";
  }catch(e){$("jobNote").textContent="读取进度失败，请稍后刷新页面。";return false;}
}
function startPolling(id){
  if(pollTimer) clearInterval(pollTimer);
  loadJob(id).then(done=>{ if(done) return;
    pollTimer=setInterval(async()=>{ const done2=await loadJob(id); if(done2) clearInterval(pollTimer); },5000);
  });
}
$("form").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const btn=$("submitBtn"); btn.disabled=true; $("formMsg").textContent="正在提交……";
  try{
    const res=await fetch("/api/investigate",{method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({direction:$("direction").value.trim(),
        language:$("language").value, region:$("region").value.trim(),
        hints:$("hints").value.trim()})});
    const d=await res.json();
    if(!res.ok){$("formMsg").textContent=d.error||"提交失败";btn.disabled=false;return;}
    $("formMsg").textContent="任务已创建，开始自动跑。页面会每5秒刷新进度。";
    btn.disabled=false; loadHistory();
const requestedJob = new URLSearchParams(window.location.search).get("job");
if(requestedJob) startPolling(requestedJob); startPolling(d.job_id);
  }catch(e){$("formMsg").textContent="提交失败，请检查网络后重试。";btn.disabled=false;}
});
async function loadHistory(){
  try{
    const res=await fetch("/api/jobs"); const d=await res.json();
    $("history").innerHTML=(d.jobs||[]).map(j=>
      `<li><a href="#" data-id="${esc(j.job_id)}">${esc(j.direction)}</a> — ${esc(j.status)} / ${esc(j.stage)}（${esc(j.created_at||"")}）</li>`).join("")||"<li class='note'>还没有任务。</li>";
    document.querySelectorAll("#history a").forEach(a=>a.addEventListener("click",ev=>{
      ev.preventDefault(); startPolling(a.dataset.id);}));
  }catch(e){$("history").innerHTML="<li class='note'>加载失败。</li>";}
}
loadHistory();
</script>
</body></html>
